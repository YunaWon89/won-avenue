# Render Blueprint: one web service (API + built React app) and a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: won-avenue
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: won-avenue-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_EMPTY
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      - key: TRANSLATION_PROVIDER
        value: auto
      # Optional — set in the dashboard (free key: https://aistudio.google.com/apikey):
      - key: GEMINI_API_KEY
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false

databases:
  - name: won-avenue-db
    plan: free
    databaseName: won_avenue
    user: won_avenue
